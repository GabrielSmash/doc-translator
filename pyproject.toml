[project]
name = "doc-translator"
version = "0.2.0"
description = "Translate PDF documents while preserving their original layout and formatting"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Gabriel Oliveira", email = "83726533+GabrielSmash@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = ["pdf", "translation", "machine-translation", "layout", "opus-mt", "ollama", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]
dependencies = [
    "ctranslate2>=4.8.5",
    "fonttools>=4.68.0",
    "huggingface-hub>=2.4.0",
    "pymupdf>=2.1",
    "sentencepiece>=0.2.2",
]

[project.urls]
Homepage = "https://github.com/GabrielSmash/doc-translator"
Issues = "https://github.com/GabrielSmash/doc-translator/issues"
Model = "https://huggingface.co/gabrielsmash/opus-mt-tc-big-en-pt-ct2-int8"

[project.optional-dependencies]
gpu = ["nvidia-cublas-cu12"]

[project.scripts]
doc-translator = "doc_translator:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["corpus: measures the public corpus (run with --corpus)"]
